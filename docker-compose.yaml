services:
  db:
    image: postgres:16
    container_name: capstone02_postgres
    environment:
      POSTGRES_USER: ${database_user}
      POSTGRES_PASSWORD: ${database_password}
      POSTGRES_DB: ${database_name}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d ##running init once when the container is created for the first time

volumes:
  postgres_data:
